name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: next-fullstack / Lint & types
            command: pnpm lint
            directory: templates/next-fullstack
          - name: next-fullstack / Format
            command: pnpm format:check
            directory: templates/next-fullstack
          - name: next-fullstack / Build
            command: pnpm build
            directory: templates/next-fullstack
          - name: next-node-nest / Web lint & types
            command: pnpm --dir apps/web lint
            directory: templates/next-node-nest
          - name: next-node-nest / API lint
            command: pnpm --dir apps/api lint
            directory: templates/next-node-nest
          - name: next-node-nest / API types
            command: pnpm --dir apps/api typecheck
            directory: templates/next-node-nest
          - name: next-node-nest / Format
            command: pnpm format:check
            directory: templates/next-node-nest
          - name: next-node-nest / Web build
            command: pnpm --dir apps/web build
            directory: templates/next-node-nest
          - name: next-node-nest / API build
            command: pnpm --dir apps/api build
            directory: templates/next-node-nest
          - name: next-static-nest / Web lint & types
            command: pnpm --dir apps/web lint
            directory: templates/next-static-nest
          - name: next-static-nest / API lint
            command: pnpm --dir apps/api lint
            directory: templates/next-static-nest
          - name: next-static-nest / API types
            command: pnpm --dir apps/api typecheck
            directory: templates/next-static-nest
          - name: next-static-nest / Format
            command: pnpm format:check
            directory: templates/next-static-nest
          - name: next-static-nest / Web build
            command: pnpm --dir apps/web build
            directory: templates/next-static-nest
          - name: next-static-nest / API build
            command: pnpm --dir apps/api build
            directory: templates/next-static-nest
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ${{ matrix.directory }}/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ${{ matrix.directory }}/package.json
          cache: true
          cache_dependency_path: ${{ matrix.directory }}/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  rust:
    name: Rust and verification runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: templates/next-fullstack/.node-version
          package-manager-cache: false
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Rust format
        run: cargo fmt --check
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Verification runner tests
        run: node --test tests/*.test.mjs
      - name: Build embedded CLI
        run: cargo build --release --locked
      - name: Verify incremental embedding
        run: python3 tests/verify_embedding.py --output-dir .cache/embedding
      - name: Save embedding results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedding-results
          path: .cache/embedding/verification.json
          retention-days: 14
          include-hidden-files: true
      - name: Share the built CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-cli-linux
          path: target/release/personal-template
          retention-days: 1

  generated:
    name: Generated / ${{ matrix.template }}
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        template: [next-fullstack, next-node-nest, next-static-nest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: templates/${{ matrix.template }}/.node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: templates/${{ matrix.template }}/package.json
          run_install: false
          cache: true
          cache_dependency_path: templates/${{ matrix.template }}/pnpm-lock.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-cli-linux
          path: .cache/bin
      - name: Verify generated projects
        timeout-minutes: 50
        run: |
          chmod +x .cache/bin/personal-template
          node scripts/verify.mjs "${{ matrix.template }}" --binary .cache/bin/personal-template --output-dir .cache/generated-report
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-${{ matrix.template }}
          path: .cache/generated-report/
          retention-days: 14
          include-hidden-files: true
