name: Deploy homepage

on:
  pull_request:
    paths:
      - site/**
      - .github/workflows/deploy-site.yml
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check homepage assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check files and JavaScript syntax
        run: |
          for file in index.html styles.css script.js favicon.svg _redirects; do
            test -s "site/$file"
          done
          node --check site/script.js

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: sonsu-homepage-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Stage public assets
        run: |
          mkdir -p "$RUNNER_TEMP/sonsu-site"
          cp site/index.html site/styles.css site/script.js site/favicon.svg site/_redirects "$RUNNER_TEMP/sonsu-site/"
      - name: Publish production deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.140.0 pages deploy "$RUNNER_TEMP/sonsu-site" --project-name=sonsu --branch=main
