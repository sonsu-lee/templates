name: Publish sonsu CLI

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - scripts/verify-package.mjs
      - install.sh
      - "bin/**"
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - "src/**"
      - "templates/**"
      - README.md
      - README.ko.md
      - README.ja.md
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native:
    name: Native / ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            executable: sonsu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: x64
            executable: sonsu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            executable: sonsu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            executable: sonsu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: x64
            executable: sonsu.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Capture source revision
        run: echo "SONSU_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Resolve and validate version
        id: metadata
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).packages[0].version))')"
          package_version="$(node -p 'require("./package.json").version')"
          test "$cargo_version" = "$package_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$package_version"
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
      - name: Build native binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Smoke test native binary and embedded template
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.executable }}"
          test "$("$binary" --version)" = "sonsu ${{ steps.metadata.outputs.version }} (source $SONSU_SOURCE_REVISION)"
          "$binary" templates
          "$binary" create "$RUNNER_TEMP/generated" --template next
          test -f "$RUNNER_TEMP/generated/package.json"
          test -f "$RUNNER_TEMP/generated/pnpm-lock.yaml"
      - name: Stage native binary
        run: |
          destination=".cache/package/native/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$destination"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$destination/${{ matrix.executable }}"
      - name: Upload native binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: .cache/package/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Assemble npm package
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: .
          merge-multiple: true
      - name: Preserve native executable modes
        run: chmod +x native/*/sonsu
      - name: Assemble native release assets
        run: |
          mkdir -p .cache/release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            tar -czf ".cache/release/sonsu-$target.tar.gz" -C "native/$target" sonsu
          done
          (
            cd native/win32-x64
            zip "$GITHUB_WORKSPACE/.cache/release/sonsu-win32-x64.zip" sonsu.exe
          )
          (
            cd .cache/release
            sha256sum sonsu-* > SHA256SUMS
          )
      - name: Smoke test public installer
        run: |
          release_base="$(python3 -c 'from pathlib import Path; print(Path(".cache/release").resolve().as_uri())')"
          SONSU_RELEASE_BASE_URL="$release_base" \
            SONSU_INSTALL_DIR="$RUNNER_TEMP/sonsu-installer" \
            ./install.sh
          test "$("$RUNNER_TEMP/sonsu-installer/sonsu" --version)" = "sonsu $(node -p 'require("./package.json").version') (source $GITHUB_SHA)"
          "$RUNNER_TEMP/sonsu-installer/sonsu" templates
      - name: Pack and inspect npm package
        run: |
          mkdir -p .cache/npm
          npm pack --json --pack-destination .cache/npm > .cache/npm-pack.json
          node scripts/verify-package.mjs .cache/npm-pack.json
      - name: Smoke test installed npm package
        run: |
          tarball="$PWD/.cache/npm/$(node -e 'const report = require("./.cache/npm-pack.json"); console.log(report[0].filename)')"
          npm install --prefix "$RUNNER_TEMP/sonsu-package" "$tarball"
          sonsu="$RUNNER_TEMP/sonsu-package/node_modules/.bin/sonsu"
          test "$("$sonsu" --version)" = "sonsu $(node -p 'require("./package.json").version') (source $GITHUB_SHA)"
          "$sonsu" templates
          "$sonsu" create "$RUNNER_TEMP/generated-from-package" --template next
          test -f "$RUNNER_TEMP/generated-from-package/package.json"
      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: templates-npm-package
          path: .cache/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Upload native release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonsu-release-assets
          path: .cache/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@sonsu-lee"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: templates-npm-package
          path: .cache/npm
      - name: Publish package
        run: npm publish .cache/npm/*.tgz --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sonsu-release-assets
          path: .cache/release
      - name: Publish release assets
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .cache/release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" .cache/release/* \
              --verify-tag \
              --title "sonsu $GITHUB_REF_NAME" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
